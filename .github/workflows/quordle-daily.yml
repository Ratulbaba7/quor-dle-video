name: Daily Quordle Video

on:
  schedule:
    # 18:45 UTC = 00:15 IST — 15 minutes after the Wordle trigger (18:30 UTC)
    - cron: '45 18 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Quordle Solver
        env:
          HEADLESS: 'true'
          # SAME channel as Wordle: use the exact same 3 secrets the Wordle
          # repo uses. Whatever channel the refresh token was minted on is the
          # channel the video uploads to, so these must match the Wordle repo.
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_REPO_PAT: ${{ secrets.VIDEO_REPO_PAT }}
        run: python solver.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: quordle-video
          path: videos/*.mp4
          retention-days: 7
